services:
  dynamodb-local:
    image: amazon/dynamodb-local:latest
    container_name: dynamodb-local
    ports:
      - "8000:8000"
    command: "-jar DynamoDBLocal.jar -sharedDb -inMemory"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/ || exit 1"]
      interval: 2s
      timeout: 2s
      retries: 15

  dynamodb-init:
    image: amazon/aws-cli:latest
    container_name: dynamodb-init
    depends_on:
      dynamodb-local:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_DEFAULT_REGION: eu-north-1
    entrypoint: >
      sh -c "
      aws dynamodb create-table
        --table-name ImageMetadata
        --attribute-definitions AttributeName=imageId,AttributeType=S
        --key-schema AttributeName=imageId,KeyType=HASH
        --billing-mode PAY_PER_REQUEST
        --endpoint-url http://dynamodb-local:8000
      || echo 'Table already exists, skipping'
      "

  app:
    build: .
    container_name: image-recognitioner
    ports:
      - "8080:8080"
    environment:
      APP_AWS_REGION: eu-north-1
      APP_AWS_DYNAMO-DB_TABLE-NAME: ImageMetadata
      APP_AWS_DYNAMO-DB_ENDPOINT: http://dynamodb-local:8000
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
    depends_on:
      dynamodb-init:
        condition: service_completed_successfully