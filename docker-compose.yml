services:
  localstack:
    image: localstack/localstack:latest
    container_name: localstack
    ports:
      - "4566:4566"
    environment:
      LOCALSTACK_AUTH_TOKEN: ${LOCALSTACK_AUTH_TOKEN:-}
      SERVICES: s3,dynamodb
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4566/_localstack/health -o /dev/null"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 30s

  terraform:
    image: hashicorp/terraform:1.9
    container_name: terraform-init
    working_dir: /tf
    volumes:
      - ./terraform:/tf
    entrypoint: ["/bin/sh", "-c"]
    command:
      - terraform init -input=false &&
        terraform apply -auto-approve -input=false
        -var local_mode=true
        -var local_endpoint=http://localstack:4566
    depends_on:
      localstack:
        condition: service_healthy

  app:
    build: .
    container_name: image-recognitioner
    ports:
      - "8080:8080"
    environment:
      APP_AWS_REGION: eu-north-1
      APP_AWS_DYNAMO-DB_TABLE-NAME: image-metadata
      APP_AWS_DYNAMO-DB_ENDPOINT: http://localstack:4566
      APP_AWS_S3_BUCKET-NAME: image-recognitioner
      APP_AWS_S3_ENDPOINT: http://localstack:4566
      APP_AWS_S3_KEY-PREFIX: images/
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    depends_on:
      terraform:
        condition: service_completed_successfully